<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" sizes="32x32" href="/prbetlogo_square.png">
  <link rel="apple-touch-icon" href="/prbetlogo_square.png">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="方舟弗一把干员题库查询与筛选工具">
  <title>方舟弗一把 · 干员工具</title>
  <link rel="stylesheet" href="/css/game.css">
  <link rel="stylesheet" href="/css/hltv-overrides.css">
  <link rel="stylesheet" href="/css/arknights-game.css">
  <link rel="stylesheet" href="/css/arknights-tool.css">
</head>
<body class="game-page arknights-game-page ak-tool-page">
  <div class="grain" aria-hidden="true"></div>
  <header class="site-header app-header">
    <a class="logo app-brand" href="/arknights">
      <picture class="brand-art"><source media="(max-width:600px)" srcset="/prbetlogo_square.png"><img src="/prbetlogo.png" alt="PRBET"></picture>
      <span><b>方舟弗一把</b><small>ARKNIGHTS OPERATOR TOOL</small></span>
    </a>
    <nav class="primary-nav" aria-label="主导航">
      <a href="/">选择游戏</a>
      <a href="/arknights">猜干员</a>
      <a href="/play">CS2 弗一把</a>
    </nav>
    <div class="header-actions"><div class="server-pill"><i></i><span>PRTS 数据</span></div></div>
  </header>

  <main class="ak-tool-main">
    <section class="ak-tool-intro">
      <div>
        <p class="step-label">OPERATOR DATABASE</p>
        <h1>干员工具</h1>
        <p>查询方舟弗一把完整题库，支持中文名和英文名搜索。</p>
      </div>
      <div class="ak-tool-total" aria-label="题库干员数量">
        <strong id="operatorCount">0</strong>
        <span>位干员</span>
      </div>
    </section>

    <section class="ak-tool-workspace">
      <div class="ak-tool-heading">
        <div>
          <p class="step-label">FILTER &amp; BROWSE</p>
          <h2>筛选与浏览</h2>
        </div>
        <div class="ak-tool-heading-actions">
          <p id="filterSummary" aria-live="polite">正在读取题库</p>
          <button class="ak-reset-button" id="resetFilters" type="button" title="清空全部筛选">↻ <span>重置</span></button>
        </div>
      </div>

      <div class="ak-tool-filters">
        <label class="ak-tool-field ak-tool-search">
          <span>搜索</span>
          <input id="toolSearch" type="search" autocomplete="off" placeholder="干员名 / English / 阵营 / 词缀">
        </label>
        <label class="ak-tool-field"><span>职业</span><select id="filterClass"><option value="">全部职业</option></select></label>
        <label class="ak-tool-field"><span>子职业</span><select id="filterSubclass"><option value="">全部子职业</option></select></label>
        <label class="ak-tool-field"><span>星级</span><select id="filterRarity"><option value="">全部星级</option></select></label>
        <label class="ak-tool-field"><span>阵营</span><select id="filterFaction"><option value="">全部阵营</option></select></label>
        <label class="ak-tool-field"><span>年份</span><select id="filterYear"><option value="">全部年份</option></select></label>
        <label class="ak-tool-field"><span>部署位</span><select id="filterPosition"><option value="">全部部署位</option></select></label>
      </div>

      <div class="ak-table-wrap" tabindex="0" aria-label="干员题库表格，可横向滚动">
        <table class="ak-operator-table">
          <thead>
            <tr><th>干员</th><th>星级</th><th>职业 / 子职业</th><th>阵营 / 分组</th><th>上线</th><th>词缀</th><th>部署位</th><th>异格</th></tr>
          </thead>
          <tbody id="operatorRows"></tbody>
        </table>
        <div class="ak-no-results" id="noResults" hidden><strong>没有匹配的干员</strong><span>请减少筛选条件或清空搜索内容。</span></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span>PR弗一把</span>
    <span>干员资料来自 <a href="https://prts.wiki/w/%E5%B9%B2%E5%91%98%E4%B8%80%E8%A7%88" target="_blank" rel="noopener noreferrer">PRTS Wiki</a></span>
  </footer>
  <script src="/data/arknights-operators.js"></script>
  <script src="/js/arknights-tool.js"></script>
</body>
</html>
